[package]
name = "nap"
version = "0.1.0"
edition = "2024"
description = "Nice Audio Player — a cassette deck for Hyprland / Omarchy"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "0.2"
lofty = "0.25.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
